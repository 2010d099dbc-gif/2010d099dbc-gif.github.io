<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蟹王府 · 茅台十五年东京品鉴会 菜单</title>
<style>
  :root{--paper:#f6f3ec;--ink:#221f1a;--ink2:#6e6355;--zhu:#8E1B18;--card:#fff;--line:#e2dccd}
  @media (prefers-color-scheme:dark){:root{--paper:#191713;--ink:#ece7db;--ink2:#a89c88;--zhu:#d4675c;--card:#211e19;--line:#3a352c}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Hiragino Mincho ProN","Noto Serif CJK SC",serif;
    line-height:1.7;padding:26px 16px 70px}
  main{max-width:760px;margin:0 auto}
  h1{font-size:1.35rem;letter-spacing:.1em;margin-bottom:4px}
  .sub{color:var(--ink2);font-size:.85rem;margin-bottom:4px}
  .tag{display:inline-block;background:var(--zhu);color:#fff;font-size:.72rem;
    padding:3px 12px;border-radius:99px;letter-spacing:.08em;margin:14px 0 4px}
  .hint{color:var(--ink2);font-size:.8rem;margin-bottom:24px}
  figure{margin:0 0 34px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;overflow:hidden}
  figcaption{font-size:.92rem;padding:14px 16px 4px;letter-spacing:.04em}
  img{width:100%;display:block}
  .dl{display:flex;gap:10px;padding:12px 16px 16px;flex-wrap:wrap}
  a.btn{flex:1;min-width:130px;text-align:center;text-decoration:none;
    background:var(--zhu);color:#fff;padding:11px 14px;border-radius:8px;
    font-size:.9rem;letter-spacing:.04em}
  a.btn.alt{background:transparent;color:var(--zhu);border:1px solid var(--zhu)}
  footer{color:var(--ink2);font-size:.75rem;text-align:center;margin-top:20px;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <h1>蟹王府 · 茅台十五年 東京品評會</h1>
  <div class="sub">席上献立 · 菜名核对（面3 / 面4 / 面5，全26道）</div>
  <div class="tag">日文名 · 厨房确认版</div>
  <div class="hint">下方每张可直接查看；点「下载高清」保存原图（约 2.7 MB / 张，1624×3724）。任何人可访问，无需登录。</div>

  <figure>
    <figcaption>面3 · 前菜（10道）</figcaption>
    <img src="p3_appetizers_preview.jpg" alt="前菜">
    <div class="dl">
      <a class="btn" href="p3_appetizers.png" download>下载高清 PNG</a>
      <a class="btn alt" href="p3_appetizers.png" target="_blank">新窗口查看</a>
    </div>
  </figure>

  <figure>
    <figcaption>面4 · 点心 · 汤品 · 热菜 1–6</figcaption>
    <img src="p4_dimsum_soup_hot_preview.jpg" alt="点心汤品热菜">
    <div class="dl">
      <a class="btn" href="p4_dimsum_soup_hot.png" download>下载高清 PNG</a>
      <a class="btn alt" href="p4_dimsum_soup_hot.png" target="_blank">新窗口查看</a>
    </div>
  </figure>

  <figure>
    <figcaption>面5 · 热菜 7–12 · 主食 · 甜品</figcaption>
    <img src="p5_hot_rice_dessert_preview.jpg" alt="热菜主食甜品">
    <div class="dl">
      <a class="btn" href="p5_hot_rice_dessert.png" download>下载高清 PNG</a>
      <a class="btn alt" href="p5_hot_rice_dessert.png" target="_blank">新窗口查看</a>
    </div>
  </figure>

  <footer>日文菜名已按蟹王府厨房确认稿替换。英文译名尚未经厨房确认。<br>日和商事株式会社 · 设计部</footer>
</main>
</body>
</html>
